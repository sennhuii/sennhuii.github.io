<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d1b0d">
<title>森辉音乐</title>
<style>
:root {
  --bg-deep: #0a120a;
  --bg-card: #121e12;
  --bg-surface: #1a261a;
  --bg-hover: #223622;
  --primary: #c9a84c;
  --primary-dim: #8b7332;
  --accent: #4a9b5e;
  --text-main: #e8e0c8;
  --text-sub: #7a8c7a;
  --text-muted: #4a5c4a;
  --border: #1e2e1e;
  --shadow: rgba(0,0,0,0.5);
  --danger: #c45c3e;
  --radius: 14px;
  --radius-sm: 8px;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg-deep); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; overflow: hidden; height: 100vh; height: 100dvh; }

#app { display: flex; flex-direction: column; height: 100%; max-width: 420px; margin: 0 auto; position: relative; }

/* 顶部栏 */
#topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; padding-top: max(14px, env(safe-area-inset-top)); background: var(--bg-deep); z-index: 10; }
#topbar h1 { font-size: 20px; font-weight: 800; background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 2px; }
#topbar .actions { display: flex; gap: 10px; }
#topbar .icon-btn { width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--bg-surface); color: var(--text-main); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

/* 内容区 */
#pages { flex: 1; overflow-y: auto; overflow-x: hidden; }
.page { display: none; padding: 12px 16px 120px; min-height: 100%; }
.page.active { display: block; }

/* 发现页 */
#file-drop { border: 2px dashed var(--border); border-radius: var(--radius); padding: 40px 20px; text-align: center; margin-bottom: 16px; transition: all 0.3s; cursor: pointer; }
#file-drop.dragover { border-color: var(--primary); background: rgba(201,168,76,0.08); }
#file-drop .drop-icon { font-size: 48px; margin-bottom: 12px; }
#file-drop p { color: var(--text-sub); font-size: 14px; }
#file-drop .add-btn { margin-top: 12px; padding: 10px 28px; background: linear-gradient(135deg, var(--primary-dim), var(--primary)); border: none; border-radius: 20px; color: var(--bg-deep); font-size: 14px; font-weight: 700; cursor: pointer; }

/* 列表项 */
.track-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: var(--radius-sm); cursor: pointer; transition: background 0.2s; margin-bottom: 4px; }
.track-item:hover { background: var(--bg-hover); }
.track-item.active { background: var(--bg-hover); border-left: 3px solid var(--primary); }
.track-item .track-cover { width: 44px; height: 44px; border-radius: 6px; background: var(--bg-surface); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; overflow: hidden; }
.track-item .track-cover img { width: 100%; height: 100%; object-fit: cover; }
.track-item .track-info { flex: 1; min-width: 0; }
.track-item .track-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.track-item .track-artist { font-size: 12px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.track-item .track-duration { font-size: 12px; color: var(--text-muted); flex-shrink: 0; }

/* 播放页 */
#player-page { text-align: center; padding-top: 20px; }
#cover-wrap { width: 280px; height: 280px; margin: 0 auto 24px; border-radius: 20px; overflow: hidden; background: linear-gradient(135deg, var(--bg-surface), var(--bg-card)); box-shadow: 0 20px 60px var(--shadow); display: flex; align-items: center; justify-content: center; position: relative; }
#cover-wrap img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; opacity: 0; transition: opacity 0.5s; }
#cover-wrap img.loaded { opacity: 1; }
#cover-wrap .cover-placeholder { font-size: 80px; z-index: 0; }
#track-name { font-size: 20px; font-weight: 800; margin-bottom: 6px; padding: 0 20px; }
#track-artist-name { font-size: 14px; color: var(--text-sub); margin-bottom: 24px; }

/* 进度条 */
.progress-wrap { padding: 0 8px; margin-bottom: 8px; }
#progress { width: 100%; height: 4px; -webkit-appearance: none; appearance: none; background: var(--bg-surface); border-radius: 2px; outline: none; cursor: pointer; }
#progress::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--primary); cursor: pointer; }
.progress-time { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); padding: 4px 8px 0; }

/* 控制按钮 */
.controls { display: flex; align-items: center; justify-content: center; gap: 20px; margin: 20px 0; }
.controls .btn-play { width: 64px; height: 64px; border-radius: 50%; border: none; background: linear-gradient(135deg, var(--primary), var(--primary-dim)); color: var(--bg-deep); font-size: 26px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(201,168,76,0.3); }
.controls .btn-small { width: 44px; height: 44px; border-radius: 50%; border: none; background: var(--bg-surface); color: var(--text-main); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

/* 倍速 */
.speed-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 16px; }
.speed-btn { padding: 5px 12px; border-radius: 12px; border: 1px solid var(--border); background: transparent; color: var(--text-sub); font-size: 12px; cursor: pointer; }
.speed-btn.active { background: var(--primary); color: var(--bg-deep); border-color: var(--primary); font-weight: 700; }

/* 歌词 */
#lyric-area { margin-top: 16px; text-align: left; max-height: 180px; overflow-y: auto; padding: 0 12px; }
#lyric-area .lyric-line { padding: 4px 0; font-size: 13px; color: var(--text-muted); transition: all 0.3s; line-height: 1.6; }
#lyric-area .lyric-line.active { color: var(--primary); font-size: 15px; font-weight: 700; }
#lyric-area .lyric-load-btn { padding: 6px 16px; background: var(--bg-surface); border: 1px solid var(--border); border-radius: 12px; color: var(--text-sub); font-size: 12px; cursor: pointer; margin-top: 8px; }

/* 队列页 */
.queue-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.queue-header h3 { font-size: 16px; font-weight: 700; }
.queue-header .mode-btn { padding: 6px 12px; background: var(--bg-surface); border: 1px solid var(--border); border-radius: 12px; color: var(--text-sub); font-size: 12px; cursor: pointer; }

/* 底部迷你条 */
#mini-player { position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%); width: calc(100% - 32px); max-width: 388px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 10px 14px; display: flex; align-items: center; gap: 12px; cursor: pointer; z-index: 50; box-shadow: 0 8px 32px var(--shadow); transition: opacity 0.3s; }
#mini-player.hidden { opacity: 0; pointer-events: none; }
#mini-cover { width: 40px; height: 40px; border-radius: 6px; background: var(--bg-surface); display: flex; align-items: center; justify-content: center; font-size: 18px; overflow: hidden; flex-shrink: 0; }
#mini-cover img { width: 100%; height: 100%; object-fit: cover; }
#mini-info { flex: 1; min-width: 0; }
#mini-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#mini-artist { font-size: 11px; color: var(--text-sub); }
#mini-play-btn { width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--primary); color: var(--bg-deep); font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

/* 底部导航 */
#bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 420px; display: flex; background: var(--bg-card); border-top: 1px solid var(--border); z-index: 100; padding-bottom: env(safe-area-inset-bottom); }
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 10px 0 6px; cursor: pointer; color: var(--text-muted); font-size: 11px; gap: 3px; transition: color 0.2s; }
.nav-item.active { color: var(--primary); }
.nav-item .nav-icon { font-size: 22px; }

/* 视频全屏 */
#video-overlay { position: fixed; inset: 0; background: #000; z-index: 9999; display: none; }
#video-overlay.show { display: block; }
#video-overlay video { width: 100%; height: 100%; object-fit: contain; }
#video-close { position: absolute; top: max(12px, env(safe-area-inset-top)); right: 12px; z-index: 10001; width: 40px; height: 40px; border-radius: 50%; border: none; background: rgba(0,0,0,0.6); color: #fff; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

/* 空状态 */
.empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
.empty-state .empty-icon { font-size: 64px; margin-bottom: 16px; }

/* 滚动条 */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* 横屏时视频全屏 */
@media (orientation: landscape) {
  #video-overlay.show { display: block; }
}
</style>
</head>
<body>
<div id="app">

  <!-- 顶部 -->
  <div id="topbar">
    <h1>森辉音乐</h1>
    <div class="actions">
      <button class="icon-btn" onclick="document.getElementById('file-input').click()" title="添加文件">+</button>
      <button class="icon-btn" onclick="document.getElementById('video-input').click()" title="添加视频">▶</button>
    </div>
  </div>

  <!-- 页面内容 -->
  <div id="pages">
    <!-- 发现页 -->
    <div class="page active" id="page-discover">
      <div id="file-drop">
        <div class="drop-icon">🎵</div>
        <p>点击或拖拽音频文件到此处</p>
        <button class="add-btn" onclick="document.getElementById('file-input').click()">选择文件</button>
      </div>
      <div id="track-list"></div>
    </div>

    <!-- 播放页 -->
    <div class="page" id="page-player">
      <div id="cover-wrap">
        <div class="cover-placeholder">♪</div>
        <img id="cover-img" src="" alt="">
      </div>
      <div id="track-name">未选择</div>
      <div id="track-artist-name">-</div>

      <div class="progress-wrap">
        <input type="range" id="progress" min="0" max="100" value="0" step="0.1">
        <div class="progress-time">
          <span id="time-current">0:00</span>
          <span id="time-total">0:00</span>
        </div>
      </div>

      <div class="controls">
        <button class="btn-small" id="btn-prev" title="上一首">⏮</button>
        <button class="btn-play" id="btn-play" title="播放/暂停">▶</button>
        <button class="btn-small" id="btn-next" title="下一首">⏭</button>
      </div>

      <div class="speed-row">
        <span style="font-size:12px;color:var(--text-muted)">倍速</span>
        <button class="speed-btn" data-speed="0.5">0.5x</button>
        <button class="speed-btn" data-speed="0.75">0.75x</button>
        <button class="speed-btn active" data-speed="1">1.0x</button>
        <button class="speed-btn" data-speed="1.25">1.25x</button>
        <button class="speed-btn" data-speed="1.5">1.5x</button>
        <button class="speed-btn" data-speed="2">2.0x</button>
      </div>

      <div id="lyric-area">
        <button class="lyric-load-btn" onclick="document.getElementById('lrc-input').click()">导入歌词 (.lrc)</button>
        <div id="lyric-lines"></div>
      </div>
    </div>

    <!-- 队列页 -->
    <div class="page" id="page-queue">
      <div class="queue-header">
        <h3>播放队列</h3>
        <button class="mode-btn" id="mode-btn">列表循环</button>
      </div>
      <div id="queue-list"></div>
    </div>
  </div>

  <!-- 迷你播放条 -->
  <div id="mini-player" class="hidden">
    <div id="mini-cover"><span>♪</span></div>
    <div id="mini-info">
      <div id="mini-title">未选择</div>
      <div id="mini-artist">-</div>
    </div>
    <button id="mini-play-btn">▶</button>
  </div>

  <!-- 底部导航 -->
  <div id="bottom-nav">
    <div class="nav-item active" data-page="page-discover"><span class="nav-icon">🔍</span>发现</div>
    <div class="nav-item" data-page="page-player"><span class="nav-icon">♪</span>播放</div>
    <div class="nav-item" data-page="page-queue"><span class="nav-icon">☰</span>队列</div>
  </div>

  <!-- 视频全屏 -->
  <div id="video-overlay">
    <button id="video-close">✕</button>
    <video id="video-el" controls playsinline></video>
  </div>

  <!-- 隐藏的 input -->
  <input type="file" id="file-input" accept="audio/*" multiple style="display:none">
  <input type="file" id="video-input" accept="video/*" multiple style="display:none">
  <input type="file" id="lrc-input" accept=".lrc" style="display:none">
</div>

<script>
// ============ 核心状态 ============
const state = {
  tracks: [],
  currentIndex: -1,
  isPlaying: false,
  speed: 1.0,
  mode: 0, // 0=列表循环 1=单曲循环 2=随机 3=顺序
  lyrics: [],
  lyricIndex: -1,
  audioCtx: null,
  gainNode: null
};

const modeNames = ['列表循环', '单曲循环', '随机', '顺序'];

// ============ DOM ============
const audio = new Audio();
const fileInput = document.getElementById('file-input');
const videoInput = document.getElementById('video-input');
const lrcInput = document.getElementById('lrc-input');
const pages = document.querySelectorAll('.page');
const navItems = document.querySelectorAll('.nav-item');
const miniPlayer = document.getElementById('mini-player');
const videoOverlay = document.getElementById('video-overlay');
const videoEl = document.getElementById('video-el');

// ============ 文件选择 ============
fileInput.addEventListener('change', e => {
  const files = Array.from(e.target.files);
  files.forEach(f => addTrack(f));
  if (state.currentIndex < 0 && state.tracks.length > 0) playTrack(0);
  renderList();
  renderQueue();
});

videoInput.addEventListener('change', e => {
  const files = Array.from(e.target.files);
  if (files.length > 0) playVideo(files[0]);
});

lrcInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    state.lyrics = parseLrc(reader.result);
    state.lyricIndex = -1;
    renderLyrics();
  };
  reader.readAsText(file);
});

// ============ 拖拽 ============
const dropZone = document.getElementById('file-drop');
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('audio/'));
  files.forEach(f => addTrack(f));
  if (state.currentIndex < 0 && state.tracks.length > 0) playTrack(0);
  renderList();
  renderQueue();
});

// ============ 添加音轨 ============
function addTrack(file) {
  const url = URL.createObjectURL(file);
  const track = {
    id: Date.now() + Math.random(),
    file, url, name: file.name.replace(/\.[^.]+$/, ''),
    artist: '未知', duration: 0, cover: null
  };
  state.tracks.push(track);
  // 获取时长
  const tmp = new Audio(url);
  tmp.addEventListener('loadedmetadata', () => { track.duration = tmp.duration; renderList(); renderQueue(); });
  // 提取封面
  extractCover(file).then(blob => { if (blob) { track.cover = URL.createObjectURL(blob); renderList(); renderQueue(); updateCover(); } });
}

// ============ 提取封面 ============
async function extractCover(file) {
  try {
    const buffer = await file.arrayBuffer();
    const dv = new DataView(buffer);
    let offset = 0;
    while (offset < buffer.byteLength - 10) {
      if (dv.getUint8(offset) === 0xFF && (dv.getUint8(offset + 1) & 0xE0) === 0xE0) {
        const header = (dv.getUint8(offset + 1) << 8) | dv.getUint8(offset + 2);
        const hasExt = (header >> 6) & 1;
        let frameSize = ((dv.getUint8(offset + 2) & 0x03) << 11) | (dv.getUint8(offset + 3) << 3) | ((dv.getUint8(offset + 4) & 0xE0) >> 5);
        let dataOffset = offset + 4;
        if (hasExt) { dataOffset += 2 + ((dv.getUint8(offset + 4) & 0x18) >> 3); }
        if (dv.getUint8(dataOffset) === 0x50 && dv.getUint8(dataOffset + 1) === 0x49 && dv.getUint8(dataOffset + 2) === 0x43) {
          const picType = dv.getUint8(dataOffset + 3);
          if (picType === 0x03 || picType === 0x04) {
            let mimeEnd = dataOffset + 4;
            while (mimeEnd < buffer.byteLength && dv.getUint8(mimeEnd) !== 0) mimeEnd++;
            let descEnd = mimeEnd + 1;
            while (descEnd < buffer.byteLength && dv.getUint8(descEnd) !== 0) descEnd++;
            const picDataStart = descEnd + 1;
            let picSize = 0;
            for (let i = 0; i < 4; i++) picSize = (picSize << 8) | dv.getUint8(picDataStart + i);
            if (picSize > 0 && picSize < 20 * 1024 * 1024) {
              return new Blob([buffer.slice(picDataStart + 4, picDataStart + 4 + picSize)], { type: 'image/jpeg' });
            }
          }
        }
        offset += 4 + frameSize;
      } else { offset++; }
    }
  } catch(e) {}
  return null;
}

// ============ 播放 ============
function playTrack(index) {
  if (index < 0 || index >= state.tracks.length) return;
  state.currentIndex = index;
  const track = state.tracks[index];
  audio.src = track.url;
  audio.playbackRate = state.speed;
  audio.play();
  state.isPlaying = true;
  updateUI();
  renderList();
  renderQueue();
  updateMediaSession();
}

function togglePlay() {
  if (state.currentIndex < 0) { if (state.tracks.length > 0) playTrack(0); return; }
  if (audio.paused) { audio.play(); state.isPlaying = true; }
  else { audio.pause(); state.isPlaying = false; }
  updateUI();
  updateMediaSession();
}

function nextTrack() {
  if (state.tracks.length === 0) return;
  let next;
  if (state.mode === 2) next = Math.floor(Math.random() * state.tracks.length);
  else if (state.mode === 1) next = state.currentIndex;
  else { next = state.currentIndex + 1; if (next >= state.tracks.length) next = 0; }
  playTrack(next);
}

function prevTrack() {
  if (state.tracks.length === 0) return;
  let prev;
  if (state.mode === 1) prev = state.currentIndex;
  else if (state.mode === 2) prev = Math.floor(Math.random() * state.tracks.length);
  else { prev = state.currentIndex - 1; if (prev < 0) prev = state.tracks.length - 1; }
  playTrack(prev);
}

// ============ 视频 ============
function playVideo(file) {
  const url = URL.createObjectURL(file);
  videoEl.src = url;
  videoOverlay.classList.add('show');
  videoEl.play();
  // 尝试横屏 + 全屏
  if (screen.orientation && screen.orientation.lock) {
    screen.orientation.lock('landscape').catch(() => {});
  }
  if (document.documentElement.requestFullscreen) {
    document.documentElement.requestFullscreen().catch(() => {});
  }
}

document.getElementById('video-close').addEventListener('click', () => {
  videoEl.pause();
  videoEl.src = '';
  videoOverlay.classList.remove('show');
  if (document.fullscreenElement) document.exitFullscreen();
  if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
});

// 视频全屏时隐藏系统状态栏
videoOverlay.addEventListener('fullscreenchange', () => {
  if (document.fullscreenElement) {
    document.body.style.paddingTop = '0';
  }
});

// ============ 事件绑定 ============
document.getElementById('btn-play').addEventListener('click', togglePlay);
document.getElementById('mini-play-btn').addEventListener('click', e => { e.stopPropagation(); togglePlay(); });
document.getElementById('btn-next').addEventListener('click', nextTrack);
document.getElementById('btn-prev').addEventListener('click', prevTrack);
miniPlayer.addEventListener('click', () => switchPage('page-player'));

document.getElementById('mode-btn').addEventListener('click', () => {
  state.mode = (state.mode + 1) % 4;
  document.getElementById('mode-btn').textContent = modeNames[state.mode];
});

// 进度条
const progressEl = document.getElementById('progress');
progressEl.addEventListener('input', () => {
  if (audio.duration) { audio.currentTime = (progressEl.value / 100) * audio.duration; }
});
audio.addEventListener('timeupdate', () => {
  if (audio.duration) {
    progressEl.value = (audio.currentTime / audio.duration) * 100;
    document.getElementById('time-current').textContent = formatTime(audio.currentTime);
    updateLyricHighlight();
  }
});
audio.addEventListener('loadedmetadata', () => {
  document.getElementById('time-total').textContent = formatTime(audio.duration);
});
audio.addEventListener('ended', nextTrack);

// 倍速
document.querySelectorAll('.speed-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.speed = parseFloat(btn.dataset.speed);
    audio.playbackRate = state.speed;
  });
});

// 导航
navItems.forEach(item => {
  item.addEventListener('click', () => switchPage(item.dataset.page));
});

// 键盘
document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  if (e.code === 'ArrowLeft') audio.currentTime = Math.max(0, audio.currentTime - 10);
  if (e.code === 'ArrowRight') audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 10);
});

// MediaSession
if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('play', togglePlay);
  navigator.mediaSession.setActionHandler('pause', togglePlay);
  navigator.mediaSession.setActionHandler('previoustrack', prevTrack);
  navigator.mediaSession.setActionHandler('nexttrack', nextTrack);
}

// ============ UI 更新 ============
function updateUI() {
  const track = state.tracks[state.currentIndex];
  const playIcon = state.isPlaying ? '⏸' : '▶';
  document.getElementById('btn-play').textContent = playIcon;
  document.getElementById('mini-play-btn').textContent = playIcon;

  if (track) {
    document.getElementById('track-name').textContent = track.name;
    document.getElementById('track-artist-name').textContent = track.artist;
    document.getElementById('mini-title').textContent = track.name;
    document.getElementById('mini-artist').textContent = track.artist;
    miniPlayer.classList.remove('hidden');
  } else {
    miniPlayer.classList.add('hidden');
  }
}

function updateCover() {
  const track = state.tracks[state.currentIndex];
  const img = document.getElementById('cover-img');
  if (track && track.cover) {
    img.src = track.cover;
    img.classList.add('loaded');
  } else {
    img.src = '';
    img.classList.remove('loaded');
  }
  // mini cover
  const miniC = document.getElementById('mini-cover');
  if (track && track.cover) {
    miniC.innerHTML = `<img src="${track.cover}">`;
  } else {
    miniC.innerHTML = '<span>♪</span>';
  }
}

function updateMediaSession() {
  if (!('mediaSession' in navigator) || state.currentIndex < 0) return;
  const track = state.tracks[state.currentIndex];
  navigator.mediaSession.metadata = new MediaMetadata({
    title: track.name,
    artist: track.artist,
    album: '',
    artwork: track.cover ? [{ src: track.cover, sizes: '512x512', type: 'image/jpeg' }] : []
  });
}

function switchPage(pageId) {
  pages.forEach(p => p.classList.remove('active'));
  document.getElementById(pageId).classList.add('active');
  navItems.forEach(n => n.classList.remove('active'));
  document.querySelector(`[data-page="${pageId}"]`).classList.add('active');
}

function renderList() {
  const list = document.getElementById('track-list');
  if (state.tracks.length === 0) { list.innerHTML = '<div class="empty-state"><div class="empty-icon">🎵</div><p>还没有添加音乐</p></div>'; return; }
  list.innerHTML = state.tracks.map((t, i) => `
    <div class="track-item ${i === state.currentIndex ? 'active' : ''}" data-index="${i}">
      <div class="track-cover">${t.cover ? `<img src="${t.cover}">` : '♪'}</div>
      <div class="track-info">
        <div class="track-title">${t.name}</div>
        <div class="track-artist">${t.artist}</div>
      </div>
      <div class="track-duration">${formatTime(t.duration)}</div>
    </div>
  `).join('');
  list.querySelectorAll('.track-item').forEach(el => {
    el.addEventListener('click', () => playTrack(parseInt(el.dataset.index)));
  });
}

function renderQueue() {
  const list = document.getElementById('queue-list');
  if (state.tracks.length === 0) { list.innerHTML = '<div class="empty-state"><div class="empty-icon">☰</div><p>队列为空</p></div>'; return; }
  list.innerHTML = state.tracks.map((t, i) => `
    <div class="track-item ${i === state.currentIndex ? 'active' : ''}" data-index="${i}">
      <div class="track-cover">${t.cover ? `<img src="${t.cover}">` : '♪'}</div>
      <div class="track-info">
        <div class="track-title">${t.name}</div>
        <div class="track-artist">${t.artist}</div>
      </div>
    </div>
  `).join('');
  list.querySelectorAll('.track-item').forEach(el => {
    el.addEventListener('click', () => playTrack(parseInt(el.dataset.index)));
  });
}

function renderLyrics() {
  const container = document.getElementById('lyric-lines');
  if (state.lyrics.length === 0) { container.innerHTML = '<p style="color:var(--text-muted);font-size:12px;">暂无歌词</p>'; return; }
  container.innerHTML = state.lyrics.map((l, i) => `<div class="lyric-line ${i === state.lyricIndex ? 'active' : ''}" data-index="${i}">${l.text}</div>`).join('');
}

function updateLyricHighlight() {
  if (state.lyrics.length === 0) return;
  const idx = findLyricIndex(state.lyrics, audio.currentTime * 1000);
  if (idx !== state.lyricIndex) {
    state.lyricIndex = idx;
    const lines = document.querySelectorAll('.lyric-line');
    lines.forEach((l, i) => l.classList.toggle('active', i === idx));
    if (idx >= 0) {
      lines[idx]?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }
}

// ============ LRC 解析 ============
function parseLrc(text) {
  const lines = [];
  const regex = /\[(\d{1,2}):(\d{2})(?:\.(\d{1,3}))?\]/g;
  text.split('\n').forEach(line => {
    const matches = [...line.matchAll(regex)];
    if (matches.length === 0) return;
    const lastMatch = matches[matches.length - 1];
    const lyricText = line.substring(lastMatch.index + lastMatch[0].length).trim();
    if (!lyricText) return;
    matches.forEach(m => {
      const min = parseInt(m[1]) || 0;
      const sec = parseInt(m[2]) || 0;
      const msStr = m[3] || '';
      const ms = msStr ? (msStr.length === 2 ? parseInt(msStr) * 10 : parseInt(msStr)) : 0;
      lines.push({ timeMs: min * 60000 + sec * 1000 + ms, text: lyricText });
    });
  });
  return lines.sort((a, b) => a.timeMs - b.timeMs);
}

function findLyricIndex(lines, timeMs) {
  for (let i = lines.length - 1; i >= 0; i--) {
    if (lines[i].timeMs <= timeMs) return i;
  }
  return -1;
}

function formatTime(s) {
  if (!s || isNaN(s)) return '0:00';
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return `${m}:${sec.toString().padStart(2, '0')}`;
}

// 初始化
document.getElementById('mode-btn').textContent = modeNames[0];
renderList();
renderQueue();
renderLyrics();
</script>
